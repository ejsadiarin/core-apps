host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for Core Homelab Dashboard with service monitoring and budget tracking
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Core Homelab API
  version: "2.0"
paths:
  /api/auth/demo:
    post:
      description: Login as the demo user (read-only access)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_auth.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Login as demo user
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and create session
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Delete session and clear cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - auth
  /api/auth/me:
    get:
      description: Get the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Get current user
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_domain_auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /api/budget/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_domain_budget.CategoryResponse'
            type: array
      summary: List all budget categories
      tags:
      - budget
    post:
      consumes:
      - application/json
      parameters:
      - description: Category to create
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/internal_domain_budget.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_domain_budget.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Create a new budget category
      tags:
      - budget
  /api/budget/categories/{id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Delete a budget category
      tags:
      - budget
    put:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category updates
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/internal_domain_budget.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_budget.CategoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Update a budget category
      tags:
      - budget
  /api/budget/expenses:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 5, max 100)
        in: query
        name: limit
        type: integer
      - description: Filter by category ID
        in: query
        name: category_id
        type: string
      - description: Filter from date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter to date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.PaginatedResponse-internal_domain_budget_ExpenseResponse'
      summary: List expenses with pagination
      tags:
      - budget
    post:
      consumes:
      - application/json
      parameters:
      - description: Expense to create
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/internal_domain_budget.CreateExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_domain_budget.ExpenseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Create a new expense
      tags:
      - budget
  /api/budget/expenses/{id}:
    delete:
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Delete an expense
      tags:
      - budget
    get:
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_budget.ExpenseResponse'
      summary: Get expense details
      tags:
      - budget
    put:
      consumes:
      - application/json
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      - description: Expense updates
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/internal_domain_budget.UpdateExpenseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_budget.ExpenseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.ErrorResponse'
      summary: Update an expense
      tags:
      - budget
  /api/budget/expenses/search:
    get:
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 5, max 100)
        in: query
        name: limit
        type: integer
      - description: Filter by category ID
        in: query
        name: category_id
        type: string
      - description: Filter from date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter to date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core-gateway_internal_shared_models.PaginatedResponse-internal_domain_budget_ExpenseResponse'
      summary: Search expenses by description
      tags:
      - budget
  /api/budget/incomes:
