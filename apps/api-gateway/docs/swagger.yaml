basePath: /
definitions:
  main.ServiceStatus:
    properties:
      name:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  main.SystemStats:
    properties:
      cpu:
        type: integer
      memory:
        type: integer
      network:
        properties:
          down:
            type: string
          up:
            type: string
        type: object
      storage:
        type: integer
      temperature:
        type: integer
      uptime:
        type: string
    type: object
  models.CreateServiceRequest:
    properties:
      description:
        type: string
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        maximum: 3600
        type: integer
      health_check_method:
        enum:
          - GET
          - POST
          - HEAD
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      service_type:
        maxLength: 100
        type: string
      timeout:
        maximum: 60000
        type: integer
      url:
        type: string
    required:
      - name
      - url
    type: object
  models.ErrorResponse:
    properties:
      details: {}
      error:
        type: string
    type: object
  models.UpdateServiceRequest:
    properties:
      description:
        type: string
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        maximum: 3600
        type: integer
      health_check_method:
        enum:
          - GET
          - POST
          - HEAD
        type: string
      icon:
        maxLength: 50
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      service_type:
        maxLength: 100
        type: string
      timeout:
        maximum: 60000
        type: integer
      url:
        type: string
    type: object
  pgtype.Bool:
    properties:
      bool:
        type: boolean
      valid:
        type: boolean
    type: object
  pgtype.InfinityModifier:
    enum:
      - 1
      - 0
      - -1
    type: integer
    x-enum-varnames:
      - Infinity
      - Finite
      - NegativeInfinity
  pgtype.Int4:
    properties:
      int32:
        type: integer
      valid:
        type: boolean
    type: object
  pgtype.Text:
    properties:
      string:
        type: string
      valid:
        type: boolean
    type: object
  pgtype.Timestamp:
    properties:
      infinityModifier:
        $ref: '#/definitions/pgtype.InfinityModifier'
      time:
        description: Time zone will be ignored when encoding to PostgreSQL.
        type: string
      valid:
        type: boolean
    type: object
  sqlc.ListServicesRow:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamp'
      current_status:
        type: string
      description:
        $ref: '#/definitions/pgtype.Text'
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        $ref: '#/definitions/pgtype.Int4'
      health_check_method:
        $ref: '#/definitions/pgtype.Text'
      icon:
        $ref: '#/definitions/pgtype.Text'
      id:
        type: string
      is_active:
        $ref: '#/definitions/pgtype.Bool'
      last_check:
        $ref: '#/definitions/pgtype.Timestamp'
      name:
        type: string
      response_time:
        $ref: '#/definitions/pgtype.Int4'
      service_type:
        $ref: '#/definitions/pgtype.Text'
      timeout:
        $ref: '#/definitions/pgtype.Int4'
      updated_at:
        $ref: '#/definitions/pgtype.Timestamp'
      url:
        type: string
    type: object
  sqlc.Service:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamp'
      description:
        $ref: '#/definitions/pgtype.Text'
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        $ref: '#/definitions/pgtype.Int4'
      health_check_method:
        $ref: '#/definitions/pgtype.Text'
      icon:
        $ref: '#/definitions/pgtype.Text'
      id:
        type: string
      is_active:
        $ref: '#/definitions/pgtype.Bool'
      name:
        type: string
      service_type:
        $ref: '#/definitions/pgtype.Text'
      timeout:
        $ref: '#/definitions/pgtype.Int4'
      updated_at:
        $ref: '#/definitions/pgtype.Timestamp'
      url:
        type: string
    type: object
  sqlc.ServiceHealthHistory:
    properties:
      checked_at:
        $ref: '#/definitions/pgtype.Timestamp'
      error_message:
        $ref: '#/definitions/pgtype.Text'
      id:
        type: string
      response_time:
        $ref: '#/definitions/pgtype.Int4'
      service_id:
        type: string
      status:
        type: string
      status_code:
        $ref: '#/definitions/pgtype.Int4'
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: Get mock service list for backwards compatibility
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Core Homelab API
  version: "2.0"
paths:
  /api/services:
    get:
      deprecated: true
      description: Get mock service list for backwards compatibility
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ServiceStatus'
            type: array
      summary: Get legacy services (deprecated)
      tags:
        - legacy
    post:
      consumes:
        - application/json
      description: Create a new service for health monitoring
      parameters:
        - description: Service to create
          in: body
          name: service
          required: true
          schema:
            $ref: '#/definitions/models.CreateServiceRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/sqlc.Service'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a new service
      tags:
        - services
  /api/services/{id}:
    delete:
      description: Delete a service by ID
      parameters:
        - description: Service ID
          in: path
          name: id
          required: true
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete a service
      tags:
        - services
    get:
      description: Get detailed information about a specific service
      parameters:
        - description: Service ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sqlc.Service'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get a service by ID
      tags:
        - services
    put:
      consumes:
        - application/json
      description: Update an existing service configuration
      parameters:
        - description: Service ID
          in: path
          name: id
          required: true
          type: string
        - description: Service updates
          in: body
          name: service
          required: true
          schema:
            $ref: '#/definitions/models.UpdateServiceRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sqlc.Service'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update a service
      tags:
        - services
  /api/services/{id}/history:
    get:
      description: Get health check history for a specific service
      parameters:
        - description: Service ID
          in: path
          name: id
          required: true
          type: string
        - default: 100
          description: Limit
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sqlc.ServiceHealthHistory'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get service health history
      tags:
        - services
  /api/services/{id}/stats:
    get:
      description: Get uptime statistics for a specific service
      parameters:
        - description: Service ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get service statistics
      tags:
        - services
  /api/services/list:
    get:
      description: Get all active services with their current health status
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sqlc.ListServicesRow'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List all services
      tags:
        - services
  /api/services/stats/all:
    get:
      description: Get overall statistics for all services
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get overall statistics
      tags:
        - services
  /api/system/stats:
    get:
      description: Get mock system statistics (CPU, memory, etc.)
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SystemStats'
      summary: Get system statistics
      tags:
        - system
  /health:
    get:
      description: Check if the API is running
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
        - health
produces:
  - application/json
  - application/json
  - application/json
schemes:
  - http
  - https
swagger: "2.0"
