definitions:
  main.ServiceStatus:
    properties:
      name:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  main.SystemStats:
    properties:
      cpu:
        type: integer
      memory:
        type: integer
      network:
        properties:
          down:
            type: string
          up:
            type: string
        type: object
      storage:
        type: integer
      temperature:
        type: integer
      uptime:
        type: string
    type: object
  models.CategoryBreakdownItem:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      color:
        type: string
      count:
        type: integer
      percentage:
        type: number
      total_amount:
        type: number
    type: object
  models.CategoryResponse:
    properties:
      color:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.CreateCategoryRequest:
    properties:
      color:
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  models.CreateExpenseRequest:
    properties:
      amount:
        description: Will be converted to pgtype.Numeric
        type: number
      category_id:
        type: string
      currency:
        type: string
      description:
        type: string
      expense_date:
        description: YYYY-MM-DD
        type: string
      notes:
        type: string
      tag_ids:
        items:
          type: string
        type: array
    required:
    - amount
    - description
    - expense_date
    type: object
  models.CreateServiceRequest:
    properties:
      description:
        type: string
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        maximum: 3600
        type: integer
      health_check_method:
        enum:
        - GET
        - POST
        - HEAD
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      service_type:
        maxLength: 100
        type: string
      timeout:
        maximum: 60000
        type: integer
      url:
        type: string
    required:
    - name
    - url
    type: object
  models.CreateTagRequest:
    properties:
      color:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  models.ErrorResponse:
    properties:
      details: {}
      error:
        type: string
    type: object
  models.ExpenseResponse:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/models.CategoryResponse'
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      expense_date:
        description: YYYY-MM-DD
        type: string
      id:
        type: string
      notes:
        type: string
      tags:
        items:
          $ref: '#/definitions/models.TagResponse'
        type: array
      updated_at:
        type: string
    type: object
  models.SummaryStatsResponse:
    properties:
      period:
        description: '"total", "month", etc'
        type: string
      total_spent:
        type: number
      transaction_count:
        type: integer
    type: object
  models.TagResponse:
    properties:
      color:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.TrendItem:
    properties:
      count:
        type: integer
      date:
        description: Day or Month
        type: string
      total_amount:
        type: number
    type: object
  models.UpdateCategoryRequest:
    properties:
      color:
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  models.UpdateExpenseRequest:
    properties:
      amount:
        type: number
      category_id:
        type: string
      currency:
        type: string
      description:
        type: string
      expense_date:
        type: string
      notes:
        type: string
      tag_ids:
        description: Replaces existing tags if provided
        items:
          type: string
        type: array
    type: object
  models.UpdateServiceRequest:
    properties:
      description:
        type: string
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        maximum: 3600
        type: integer
      health_check_method:
        enum:
        - GET
        - POST
        - HEAD
        type: string
      icon:
        maxLength: 50
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      service_type:
        maxLength: 100
        type: string
      timeout:
        maximum: 60000
        type: integer
      url:
        type: string
    type: object
  models.UpdateTagRequest:
    properties:
      color:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  pgtype.Bool:
    properties:
      bool:
        type: boolean
      valid:
        type: boolean
    type: object
  pgtype.InfinityModifier:
    enum:
    - 1
    - 0
    - -1
    format: int32
    type: integer
    x-enum-varnames:
    - Infinity
    - Finite
    - NegativeInfinity
  pgtype.Int4:
    properties:
      int32:
        format: int32
        type: integer
      valid:
        type: boolean
    type: object
  pgtype.Text:
    properties:
      string:
        type: string
      valid:
        type: boolean
    type: object
  pgtype.Timestamp:
    properties:
      infinityModifier:
        $ref: '#/definitions/pgtype.InfinityModifier'
      time:
        description: Time zone will be ignored when encoding to PostgreSQL.
        type: string
      valid:
        type: boolean
    type: object
  sqlc.ListServicesRow:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamp'
      current_status:
        type: string
      description:
        $ref: '#/definitions/pgtype.Text'
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        $ref: '#/definitions/pgtype.Int4'
      health_check_method:
        $ref: '#/definitions/pgtype.Text'
      icon:
        $ref: '#/definitions/pgtype.Text'
      id:
        type: string
      is_active:
        $ref: '#/definitions/pgtype.Bool'
      last_check:
        $ref: '#/definitions/pgtype.Timestamp'
      name:
        type: string
      response_time:
        $ref: '#/definitions/pgtype.Int4'
      service_type:
        $ref: '#/definitions/pgtype.Text'
      timeout:
        $ref: '#/definitions/pgtype.Int4'
      updated_at:
        $ref: '#/definitions/pgtype.Timestamp'
      url:
        type: string
    type: object
  sqlc.Service:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamp'
      description:
        $ref: '#/definitions/pgtype.Text'
      expected_status_codes:
        items:
          type: integer
        type: array
      health_check_interval:
        $ref: '#/definitions/pgtype.Int4'
      health_check_method:
        $ref: '#/definitions/pgtype.Text'
      icon:
        $ref: '#/definitions/pgtype.Text'
      id:
        type: string
      is_active:
        $ref: '#/definitions/pgtype.Bool'
      name:
        type: string
      service_type:
        $ref: '#/definitions/pgtype.Text'
      timeout:
        $ref: '#/definitions/pgtype.Int4'
      updated_at:
        $ref: '#/definitions/pgtype.Timestamp'
      url:
        type: string
    type: object
  sqlc.ServiceHealthHistory:
    properties:
      checked_at:
        $ref: '#/definitions/pgtype.Timestamp'
      error_message:
        $ref: '#/definitions/pgtype.Text'
      id:
        type: string
      response_time:
        $ref: '#/definitions/pgtype.Int4'
      service_id:
        type: string
      status:
        type: string
      status_code:
        $ref: '#/definitions/pgtype.Int4'
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for Core Homelab Dashboard with service monitoring and budget tracking
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Core Homelab API
  version: "2.0"
paths:
  /api/budget/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CategoryResponse'
            type: array
      summary: List all budget categories
      tags:
      - budget
    post:
      consumes:
      - application/json
      parameters:
      - description: Category to create
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a new budget category
      tags:
      - budget
  /api/budget/categories/{id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a budget category
      tags:
      - budget
    put:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category updates
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CategoryResponse'
      summary: Update a budget category
      tags:
      - budget
  /api/budget/expenses:
    get:
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Category ID
        in: query
        name: category_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ExpenseResponse'
            type: array
      summary: List expenses with filters
      tags:
      - budget
    post:
      consumes:
      - application/json
      parameters:
      - description: Expense to create
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/models.CreateExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ExpenseResponse'
      summary: Create a new expense
      tags:
      - budget
  /api/budget/expenses/{id}:
    delete:
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete an expense
      tags:
      - budget
    get:
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ExpenseResponse'
      summary: Get expense details
      tags:
      - budget
    put:
      consumes:
      - application/json
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      - description: Expense updates
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/models.UpdateExpenseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ExpenseResponse'
      summary: Update an expense
      tags:
      - budget
  /api/budget/stats/category-breakdown:
    get:
      parameters:
      - description: Start date
        in: query
        name: start_date
        type: string
      - description: End date
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CategoryBreakdownItem'
            type: array
      summary: Get spending by category
      tags:
      - budget
  /api/budget/stats/summary:
    get:
      parameters:
      - description: Start date
        in: query
        name: start_date
        type: string
      - description: End date
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SummaryStatsResponse'
      summary: Get spending summary
      tags:
      - budget
  /api/budget/stats/trends:
    get:
      parameters:
      - description: Start date
        in: query
        name: start_date
        type: string
      - description: End date
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TrendItem'
            type: array
      summary: Get spending trends
      tags:
      - budget
  /api/budget/tags:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TagResponse'
            type: array
      summary: List all budget tags
      tags:
      - budget
    post:
      consumes:
      - application/json
      parameters:
      - description: Tag to create
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/models.CreateTagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.TagResponse'
      summary: Create a new budget tag
      tags:
      - budget
  /api/budget/tags/{id}:
    delete:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a budget tag
      tags:
      - budget
    put:
      consumes:
      - application/json
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      - description: Tag updates
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TagResponse'
      summary: Update a budget tag
      tags:
      - budget
  /api/services:
    get:
      deprecated: true
      description: Get mock service list for backwards compatibility
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ServiceStatus'
            type: array
      summary: Get legacy services (deprecated)
      tags:
      - legacy
    post:
      consumes:
      - application/json
      description: Create a new service for health monitoring
      parameters:
      - description: Service to create
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/models.CreateServiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/sqlc.Service'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a new service
      tags:
      - services
  /api/services/{id}:
    delete:
      description: Delete a service by ID
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete a service
      tags:
      - services
    get:
      description: Get detailed information about a specific service
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sqlc.Service'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get a service by ID
      tags:
      - services
    put:
      consumes:
      - application/json
      description: Update an existing service configuration
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      - description: Service updates
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/models.UpdateServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sqlc.Service'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update a service
      tags:
      - services
  /api/services/{id}/history:
    get:
      description: Get health check history for a specific service
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      - default: 100
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sqlc.ServiceHealthHistory'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get service health history
      tags:
      - services
  /api/services/{id}/stats:
    get:
      description: Get uptime statistics for a specific service
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get service statistics
      tags:
      - services
  /api/services/list:
    get:
      description: Get all active services with their current health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sqlc.ListServicesRow'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List all services
      tags:
      - services
  /api/services/stats/all:
    get:
      description: Get overall statistics for all services
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get overall statistics
      tags:
      - services
  /api/system/stats:
    get:
      description: Get mock system statistics (CPU, memory, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SystemStats'
      summary: Get system statistics
      tags:
      - system
  /health:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
schemes:
- http
- https
swagger: "2.0"
