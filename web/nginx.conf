server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Budget API → corefinance
    location /api/budget/ {
        rewrite ^/api/budget/(.*)$ /budget/$1 break;
        proxy_pass http://corefinance-api:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → coregateway
    location /api/ {
        proxy_pass http://coregateway-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
