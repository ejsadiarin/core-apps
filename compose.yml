---
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - coregateway-api
      - corefinance-api
    environment:
      - VITE_API_URL=http://localhost:8080

  coregateway-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8080
      - ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000
      - COREFINANCE_URL=http://corefinance-api:6969
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

  corefinance-api:
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile
    ports:
      - "6969:6969"
    environment:
      - ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - DB_SCHEMA=corefinance
      - PORT=6969
